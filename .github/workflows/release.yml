name: Release

on:
  push:
    branches: [master]
    tags:
      - 'v*'

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/jeeftor/booksync

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.25'
          cache: true

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Build frontend
        run: cd frontend && bun install --frozen-lockfile && bun run build
        env:
          NODE_OPTIONS: --no-deprecation

      - name: Copy frontend into embed dir
        run: |
          rm -rf internal/webui/dist
          mkdir -p internal/webui/dist
          cp -r frontend/dist/. internal/webui/dist/

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

  # Compute the image tag(s) to publish: the git tag for a version push, plus
  # `latest` always, plus `master` for every push to the default branch so the
  # homelab stack can track a rolling tag if it wants to.
  meta:
    needs: [test]
    runs-on: ubuntu-latest
    outputs:
      version_tag: ${{ steps.tag.outputs.version_tag }}
      build_date: ${{ steps.tag.outputs.build_date }}
      display_version: ${{ steps.tag.outputs.display_version }}
    steps:
      - id: tag
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "version_tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
            echo "display_version=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "version_tag=" >> "$GITHUB_OUTPUT"
            echo "display_version=${GITHUB_SHA:0:12}" >> "$GITHUB_OUTPUT"
          fi
          echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

  docker-amd64:
    needs: [meta]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push (amd64)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}-amd64
          build-args: |
            VERSION=${{ needs.meta.outputs.display_version }}
            COMMIT=${{ github.sha }}
            DATE=${{ needs.meta.outputs.build_date }}
          cache-from: type=gha,scope=amd64
          cache-to: type=gha,scope=amd64,mode=max

  docker-arm64:
    needs: [meta]
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push (arm64)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}-arm64
          build-args: |
            VERSION=${{ needs.meta.outputs.display_version }}
            COMMIT=${{ github.sha }}
            DATE=${{ needs.meta.outputs.build_date }}
          cache-from: type=gha,scope=arm64
          cache-to: type=gha,scope=arm64,mode=max

  manifest:
    needs: [meta, docker-amd64, docker-arm64]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch manifest
        run: |
          TAGS=(-t "${IMAGE}:latest" -t "${IMAGE}:${GITHUB_SHA}")
          if [[ -n "${VERSION_TAG}" ]]; then
            TAGS+=(-t "${IMAGE}:${VERSION_TAG}")
          fi
          docker buildx imagetools create "${TAGS[@]}" \
            "${IMAGE}:${GITHUB_SHA}-amd64" \
            "${IMAGE}:${GITHUB_SHA}-arm64"
        env:
          IMAGE: ${{ env.IMAGE }}
          VERSION_TAG: ${{ needs.meta.outputs.version_tag }}
